<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 太陽の光 -->
  <g stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="52"  x2="256" y2="22"/>
    <line x1="368" y1="94"  x2="388" y2="76"/>
    <line x1="410" y1="206" x2="440" y2="206"/>
    <line x1="368" y1="318" x2="388" y2="336"/>
    <line x1="144" y1="94"  x2="124" y2="76"/>
    <line x1="102" y1="206" x2="72"  y2="206"/>
    <line x1="144" y1="318" x2="124" y2="336"/>
  </g>

  <!-- 太陽の本体 -->
  <circle cx="256" cy="216" r="120" fill="white" opacity="0.96"/>

  <!-- 目 -->
  <ellipse cx="218" cy="202" rx="16" ry="18" fill="#FF6B6B"/>
  <ellipse cx="294" cy="202" rx="16" ry="18" fill="#FF6B6B"/>

  <!-- 笑顔 -->
  <path d="M 200 252 Q 256 300 312 252"
    stroke="#FF6B6B" stroke-width="16" fill="none"
    stroke-linecap="round"/>

  <!-- チェックマーク -->
  <path d="M 170 370 L 232 440 L 360 310"
    stroke="white" stroke-width="32" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
